services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: localpilot
      POSTGRES_PASSWORD: localpilot
      POSTGRES_DB: localpilot
    ports:
      - "5432:5432"
    volumes:
      - localpilot_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - localpilot_redis_data:/data

volumes:
  localpilot_pg_data:
  localpilot_redis_data:
